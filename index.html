<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultixMC | Minecraft Server</title>

  <!-- Embed Meta Tags (for Discord, Twitter & Link Previews) -->
  <meta property="og:title" content="VaultixMC - Minecraft Server">
  <meta property="og:description" content="Join the VaultixMC community! Connect now with IP: vaultixmc.uk">
  <meta property="og:image" content="vaultixmc_logo.png">
  <meta property="og:url" content="https://vaultixmc.uk">
  <meta name="theme-color" content="#FF9B00">
  <meta name="twitter:card" content="summary_large_image">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --card-bg: rgba(18, 18, 22, 0.85);
      --card-hover: rgba(28, 28, 35, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(255, 255, 255, 0.25);
      --accent-yellow: #FFF800;
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #FF9B00 0%, #FFF800 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
      max-width: 1040px;
      width: 100%;
    }

    /* Modern Bento Box Base Styles */
    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 155, 0, 0.2);
      background-color: var(--card-hover);
    }

    /* Full Brightness Background Images */
    .card-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(1.1) contrast(1.05);
      transition: transform 0.5s ease;
    }

    .card:hover .card-bg-img {
      transform: scale(1.03);
    }

    /* Logo & Server IP Column */
    .logo-column {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-logo {
      width: 100%;
      height: 100%;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 18, 22, 0.9);
    }

    .card-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Modern Copy IP Button */
    .ip-button {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      user-select: none;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
    }

    .ip-button:hover {
      background-color: #24242d;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    }

    .ip-button svg {
      stroke: var(--accent-yellow);
    }

    /* Store Card */
    .card-store {
      grid-column: span 5;
      aspect-ratio: 16 / 10;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 60%);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }

    .card-badge {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.5px;
    }

    /* Embedded Discord Widget Card */
    .card-discord-embed {
      grid-column: span 3;
      padding: 0;
      overflow: hidden;
      min-height: 250px;
    }

    .card-discord-embed iframe {
      width: 100%;
      height: 100%;
      min-height: 250px;
      border: none;
      display: block;
    }

    /* Stats Card */
    .card-stats {
      grid-column: span 6;
      height: 210px;
      position: relative;
    }

    .coming-soon-overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 15, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      gap: 6px;
      z-index: 3;
    }

    .card-stats:hover .coming-soon-overlay {
      opacity: 1;
    }

    .coming-soon-emoji {
      font-size: 2.5rem;
    }

    .coming-soon-text {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* How To Join Card */
    .card-join {
      grid-column: span 6;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .join-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
    }

    .field-box {
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.72rem;
      color: var(--accent-yellow);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .logo-column, .card-store, .card-discord-embed, .card-stats, .card-join {
        grid-column: span 12;
      }
      
      .card-logo, .card-store {
        aspect-ratio: auto;
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. LOGO & SERVER IP COLUMN -->
    <div class="logo-column">
      <div class="card card-logo">
        <img src="vaultixmc_logo.png" alt="VaultixMC Logo">
      </div>
      <div class="ip-button" onclick="copyIP()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="ip-text">VAULTIXMC.UK</span>
      </div>
    </div>

    <!-- 2. STORE CARD -->
    <a href="https://store.vaultixmc.uk" target="_blank" class="card card-store">
      <img src="store.jpg" class="card-bg-img" alt="Store Background">
      <div class="card-overlay">
        <span class="card-badge">Official Store</span>
        <h2 class="card-title">Store</h2>
      </div>
    </a>

    <!-- 3. EMBEDDED DISCORD WIDGET -->
    <div class="card card-discord-embed">
      <!-- Replace YOUR_DISCORD_SERVER_ID with your actual Discord Server ID -->
      <iframe src="https://discord.com/widget?id=YOUR_DISCORD_SERVER_ID&theme=dark" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
    </div>

    <!-- 4. STATS CARD -->
    <div class="card card-stats">
      <img src="stats.jpg" class="card-bg-img" alt="Stats Background">
      <div class="card-overlay">
        <span class="card-badge">Leaderboards</span>
        <h2 class="card-title">Stats</h2>
      </div>
      <div class="coming-soon-overlay">
        <span class="coming-soon-emoji">👀</span>
        <span class="coming-soon-text">Coming Soon</span>
      </div>
    </div>

    <!-- 5. HOW TO JOIN CARD -->
    <div class="card card-join">
      <h2 class="card-title">How To Join</h2>
      <div class="join-fields">
        <div class="field-group">
          <span class="field-label">Server Name</span>
          <div class="field-box">VaultixMC</div>
        </div>
        <div class="field-group">
          <span class="field-label">Server Address</span>
          <div class="field-box">vaultixmc.uk</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function copyIP() {
      const ip = "vaultixmc.uk";
      navigator.clipboard.writeText(ip);
      const textElement = document.getElementById("ip-text");
      const originalText = textElement.innerText;
      textElement.innerText = "COPIED!";
      setTimeout(() => {
        textElement.innerText = originalText;
      }, 2000);
    }
  </script>
</body>
</html>
